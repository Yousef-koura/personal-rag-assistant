<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YK Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Reset & Variables ─────────────────────────────────────── */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:        #080808;
    --surface:   #111111;
    --surface2:  #1a1a1a;
    --border:    rgba(255,255,255,0.08);
    --border-hi: rgba(255,255,255,0.2);
    --white:     #f0f0f0;
    --muted:     #666;
    --accent:    #ffffff;
    --user-bg:   #1e1e1e;
    --bot-bg:    #131313;
    --mono:      'Space Mono', monospace;
    --sans:      'DM Sans', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: var(--sans);
    overflow: hidden;
  }

  /* ── Noise texture overlay ─────────────────────────────────── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* ── Layout ────────────────────────────────────────────────── */
  .shell {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
  }

  /* ── Sidebar ───────────────────────────────────────────────── */
  .sidebar {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 28px 20px;
    gap: 32px;
    background: var(--surface);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-mark {
    width: 34px;
    height: 34px;
    border: 1.5px solid var(--border-hi);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--white);
    letter-spacing: 0.05em;
  }

  .logo-text {
    font-family: var(--mono);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: var(--white);
  }

  .logo-text span {
    color: var(--muted);
  }

  /* Status pill */
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    color: var(--muted);
    font-family: var(--mono);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #3d3d3d;
    transition: background 0.4s;
    flex-shrink: 0;
  }

  .status-dot.online { background: #4ade80; box-shadow: 0 0 6px #4ade8088; }
  .status-dot.loading { background: #facc15; animation: pulse 1s infinite; }
  .status-dot.error { background: #f87171; }

  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
  }

  /* Suggestions */
  .suggestions-label {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .suggestions {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .chip {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 0.78rem;
    color: #aaa;
    font-family: var(--sans);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
    line-height: 1.4;
  }

  .chip:hover {
    border-color: var(--border-hi);
    color: var(--white);
    background: var(--surface2);
  }

  /* Profile card at bottom */
  .profile {
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }

  .profile-name {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 2px;
  }

  .profile-role {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: var(--mono);
  }

  /* ── Main chat area ─────────────────────────────────────────── */
  .chat-area {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Top bar */
  .topbar {
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .topbar-title {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .topbar-title span {
    color: var(--white);
  }

  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 12px;
    font-size: 0.7rem;
    font-family: var(--mono);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.06em;
  }

  .clear-btn:hover {
    border-color: var(--border-hi);
    color: var(--white);
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

  /* Empty state */
  .empty-state {
    margin: auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0.5;
  }

  .empty-icon {
    font-size: 2.5rem;
    line-height: 1;
  }

  .empty-title {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--white);
    letter-spacing: 0.06em;
  }

  .empty-sub {
    font-size: 0.78rem;
    color: var(--muted);
    max-width: 260px;
    line-height: 1.6;
  }

  /* Message rows */
  .msg-row {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    animation: msgIn 0.25s ease both;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 0.6rem;
    flex-shrink: 0;
    color: var(--muted);
    background: var(--surface);
  }

  .msg-row.user .avatar {
    background: #1c1c1c;
    color: var(--white);
  }

  .bubble {
    max-width: 68%;
    padding: 13px 16px;
    border-radius: 10px;
    font-size: 0.875rem;
    line-height: 1.65;
    color: var(--white);
    border: 1px solid var(--border);
  }

  .msg-row.bot  .bubble { background: var(--bot-bg);  border-radius: 3px 10px 10px 10px; }
  .msg-row.user .bubble { background: var(--user-bg); border-radius: 10px 3px 10px 10px; }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 14px 16px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* ── Input bar ──────────────────────────────────────────────── */
  .input-bar {
    border-top: 1px solid var(--border);
    padding: 16px 28px 20px;
    flex-shrink: 0;
  }

  .input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    transition: border-color 0.2s;
  }

  .input-wrap:focus-within {
    border-color: var(--border-hi);
  }

  .input-wrap textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--white);
    font-family: var(--sans);
    font-size: 0.875rem;
    resize: none;
    height: 22px;
    max-height: 120px;
    line-height: 1.5;
    overflow-y: auto;
  }

  .input-wrap textarea::placeholder { color: var(--muted); }

  .send-btn {
    width: 32px;
    height: 32px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .send-btn:hover, .send-btn.active {
    background: var(--white);
    color: var(--bg);
    border-color: var(--white);
  }

  .send-btn svg { width: 14px; height: 14px; }

  .input-hint {
    font-size: 0.65rem;
    color: #333;
    font-family: var(--mono);
    margin-top: 8px;
    text-align: right;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<div class="shell">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div>
      <div class="logo">
        <div class="logo-mark">YK</div>
        <div class="logo-text">Assistant<span>/v1</span></div>
      </div>
    </div>

    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">connecting...</span>
    </div>

    <div>
      <div class="suggestions-label">Try asking</div>
      <div class="suggestions" id="chips"></div>
    </div>

    <div class="profile">
      <div class="profile-name">Yousef Koura</div>
      <div class="profile-role">ML Engineer</div>
    </div>
  </aside>

  <!-- ── Chat ── -->
  <main class="chat-area">

    <div class="topbar">
      <div class="topbar-title">chat <span>/ new session</span></div>
      <button class="clear-btn" id="clearBtn">clear</button>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">◈</div>
        <div class="empty-title">YK ASSISTANT</div>
        <div class="empty-sub">Ask me anything about Yousef's skills, projects, experience, or education.</div>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea
          id="inputBox"
          placeholder="Ask a question..."
          rows="1"
        ></textarea>
        <button class="send-btn" id="sendBtn" title="Send">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 8h12M8 2l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">enter to send &nbsp;·&nbsp; shift+enter for newline</div>
    </div>

  </main>
</div>

<script>
  const API = "http://localhost:8000";

  const messagesEl  = document.getElementById("messages");
  const inputBox    = document.getElementById("inputBox");
  const sendBtn     = document.getElementById("sendBtn");
  const clearBtn    = document.getElementById("clearBtn");
  const statusDot   = document.getElementById("statusDot");
  const statusText  = document.getElementById("statusText");
  const emptyState  = document.getElementById("emptyState");
  const chipsEl     = document.getElementById("chips");

  const CHIPS = [
    "What projects has Yousef built?",
    "What are his technical skills?",
    "Tell me about his education",
    "List his work experience",
    "What is the Agri-Bot project?",
    "Does he have any publications?",
    "What ML frameworks does he use?",
  ];

  // ── Build suggestion chips ──────────────────────────────────
  CHIPS.forEach(q => {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.textContent = q;
    btn.onclick = () => ask(q);
    chipsEl.appendChild(btn);
  });

  // ── Health check ────────────────────────────────────────────
  async function checkHealth() {
    setStatus("loading", "connecting...");
    try {
      const res = await fetch(`${API}/health`);
      const data = await res.json();
      if (data.chain_ready) {
        setStatus("online", "online");
      } else {
        setStatus("loading", "building chain...");
        setTimeout(checkHealth, 3000);
      }
    } catch {
      setStatus("error", "server offline");
      setTimeout(checkHealth, 5000);
    }
  }

  function setStatus(state, text) {
    statusDot.className = `status-dot ${state}`;
    statusText.textContent = text;
  }

  // ── Message rendering ────────────────────────────────────────
  function appendMessage(role, text) {
    emptyState.style.display = "none";

    const row = document.createElement("div");
    row.className = `msg-row ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "YOU" : "YK";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function showTyping() {
    emptyState.style.display = "none";
    const row = document.createElement("div");
    row.className = "msg-row bot";
    row.id = "typing-row";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "YK";

    const bubble = document.createElement("div");
    bubble.className = "bubble typing";
    bubble.innerHTML = "<span></span><span></span><span></span>";

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    document.getElementById("typing-row")?.remove();
  }

  // ── Ask ──────────────────────────────────────────────────────
  async function ask(question) {
    const q = question.trim();
    if (!q) return;

    appendMessage("user", q);
    inputBox.value = "";
    autoResize();
    setInputDisabled(true);
    showTyping();

    try {
      const res = await fetch(`${API}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q }),
      });

      const data = await res.json();
      removeTyping();

      if (res.ok) {
        appendMessage("bot", data.answer);
      } else {
        appendMessage("bot", "⚠️ Something went wrong. Please try again.");
      }
    } catch {
      removeTyping();
      appendMessage("bot", "⚠️ Cannot reach the server. Make sure uvicorn is running on port 8000.");
    } finally {
      setInputDisabled(false);
      inputBox.focus();
    }
  }

  // ── Input helpers ────────────────────────────────────────────
  function setInputDisabled(val) {
    inputBox.disabled = val;
    sendBtn.disabled = val;
    sendBtn.classList.toggle("active", !val);
  }

  function autoResize() {
    inputBox.style.height = "22px";
    inputBox.style.height = Math.min(inputBox.scrollHeight, 120) + "px";
  }

  inputBox.addEventListener("input", autoResize);

  inputBox.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      ask(inputBox.value);
    }
  });

  sendBtn.addEventListener("click", () => ask(inputBox.value));

  clearBtn.addEventListener("click", () => {
    messagesEl.innerHTML = "";
    messagesEl.appendChild(emptyState);
    emptyState.style.display = "flex";
  });

  // ── Init ─────────────────────────────────────────────────────
  checkHealth();
  inputBox.focus();
</script>
</body>
</html>
